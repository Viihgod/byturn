name: Portfolio demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-demo
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec -- vite build --config vite.demo.config.ts
      - name: Add the product walkthrough
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -r demo/showcase dist-demo/showcase
          cp docs/showcase/byturn-cover.webp dist-demo/showcase/byturn-film-cover.webp
          gh release download v0.1.0 --pattern byturn-walkthrough-en.mp4 --dir dist-demo/showcase
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo
      - id: deployment
        uses: actions/deploy-pages@v4
